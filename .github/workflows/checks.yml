name: Public configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject private infrastructure data
        run: python3 tools/check-public-data.py
      - name: Test agent lifecycle helpers with isolated processes
        run: python3 dev-servers/tests/test-agent-tools.py
