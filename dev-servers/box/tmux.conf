# Rendered per box by finish.sh (__LABEL__, __COLOR__).
set -g default-shell /usr/bin/zsh
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
# Pass Shift+Enter, Ctrl+arrows and similar through to Claude, Codex and zsh.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -s set-clipboard on
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# WezTerm and the phone attach with different sizes.
setw -g aggressive-resize on
set -g status-style 'bg=__COLOR__,fg=#f0f0f0'
set -g status-left '#[bold] __LABEL__ #[default]| #S '
set -g status-left-length 40
set -g status-right ' %H:%M '
bind s choose-tree -sZ
