add_newline = false
format = "$username$hostname$directory$git_branch$cmd_duration$line_break$character"
[username]
show_always = false
[hostname]
ssh_only = false
format = "[$hostname](bold cyan) "
[directory]
truncation_length = 4
truncate_to_repo = false
[git_branch]
symbol = "git:"
[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
