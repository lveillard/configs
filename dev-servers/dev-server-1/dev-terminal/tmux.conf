set -g default-shell /home/devuser/.local/bin/dev-shell
set -g default-command '/home/devuser/.local/bin/dev-shell -l'
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g destroy-unattached off
set -g detach-on-destroy on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status 2
set -g status-interval 1
set -g status-style 'bg=#17212b,fg=#c7d5e0'
set -g status-left '#[fg=#66d9b0,bold] #S #[default] '
set -g status-left-length 35
set -g status-right '#[fg=#66d9b0,bold] F1 Ayuda / clic #[default] '
set -g status-right-length 22
# Keep the window list on row one. Row two teaches the prefix without taking focus.
set -g status-format[1] '#[align=left,bg=#{?client_prefix,#36465b,#17212b},fg=#e0e8f0]#{?client_prefix, AHORA pulsa: , Ctrl+B luego: }#{?#{<:#{client_width},105},s Lista  c Nueva  v/h Panel  d Volver | F1 Ayuda | F12 Lista,#[bold]s#[nobold] Sesiones  #[bold]c#[nobold] Ventana  #[bold]v/h#[nobold] Dividir  #[bold]d#[nobold] Desconectar | #[bold]F12#[nobold] Selector | F1 Todos}#{?client_prefix, | Esc cancela,}'
set -g menu-style 'bg=#17212b,fg=#c7d5e0'
set -g menu-selected-style 'bg=#66d9b0,fg=#17212b'
set -g menu-border-style 'fg=#66d9b0'
set -g popup-style 'bg=#17212b,fg=#c7d5e0'
set -g popup-border-style 'fg=#66d9b0'
set -g message-style 'bg=#36465b,fg=#e0e8f0'
setw -g window-status-current-style 'fg=#17212b,bg=#66d9b0,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
bind s choose-tree -sZ
bind m display-popup -E -w 95% -h 95% -T ' Dev Sessions ' '/home/devuser/.local/bin/dev'
bind -n F12 display-popup -E -w 95% -h 95% -T ' Dev Sessions ' '/home/devuser/.local/bin/dev'
bind -n F1 run-shell -b '/home/devuser/.config/dev-terminal/dev-actions "#{client_name}" "#{pane_id}"'
bind F1 run-shell -b '/home/devuser/.config/dev-terminal/dev-actions "#{client_name}" "#{pane_id}"'
bind ? run-shell -b '/home/devuser/.config/dev-terminal/dev-actions "#{client_name}" "#{pane_id}"'
bind Escape switch-client -T root
bind -n MouseDown1StatusRight run-shell -b '/home/devuser/.config/dev-terminal/dev-actions "#{client_name}" "#{pane_id}"'
bind -n MouseDown1StatusLeft display-popup -E -w 95% -h 95% -T ' Dev Sessions ' '/home/devuser/.local/bin/dev'
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'
bind r command-prompt -I '#S' -p 'Nombre de la sesion:' 'rename-session -- "%%"'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
